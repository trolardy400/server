Events:
  event1:
    type: player_command
    conditions:
    - '%main_command% equalsIgnoreCase /add'
    actions:
      default:
      - 'cancel_event: true'
      - 'console_command: lp user %player% parent set %arg_1%'
  example:
    type: player_respawn
    actions:
      default:
      - "teleport: lobby;406.5;50;-636.51;90;0"
  example1:
  type: player_join
  actions:
    default:
    - 'console_command: eco give %player% 5000'